name: Quality

on:
  workflow_call:
    inputs:
      target-sha:
        description: 'Target Git commit SHA to test'
        required: true
        type: string
    outputs:
      tested-sha:
        description: 'Verified Git commit SHA tested by all quality gates'
        value: ${{ jobs.aggregate.outputs.tested-sha }}

permissions:
  contents: read

jobs:
  code_quality:
    name: Code Quality (L1 + G1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target-sha }}
          persist-credentials: false

      - name: Validate tested commit SHA
        id: sha-check
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          node -e '
            import("./scripts/aggregate-quality.mjs").then(m => {
              m.validateGateShas(process.env.EXPECTED_SHA, process.env.ACTUAL_SHA, "code_quality");
            });
          '
          echo "tested_sha=${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"
        env:
          EXPECTED_SHA: ${{ inputs.target-sha }}
          ACTUAL_SHA: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Worker configuration types
        run: npm run cf:typegen -- --check

      - name: Run G1 static checks
        run: npm run quality:g1

      - name: Run L1 unit coverage gate
        run: npm run quality:l1

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 14
    outputs:
      tested_sha: ${{ steps.sha-check.outputs.tested_sha }}

  integration_quality:
    name: Integration Quality (L2 + HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target-sha }}
          persist-credentials: false

      - name: Validate tested commit SHA
        id: sha-check
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          node -e '
            import("./scripts/aggregate-quality.mjs").then(m => {
              m.validateGateShas(process.env.EXPECTED_SHA, process.env.ACTUAL_SHA, "integration_quality");
            });
          '
          echo "tested_sha=${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"
        env:
          EXPECTED_SHA: ${{ inputs.target-sha }}
          ACTUAL_SHA: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run HTTP regression suite
        run: npm run test:http

      - name: Run L2 production runtime gate
        run: npm run quality:l2
    outputs:
      tested_sha: ${{ steps.sha-check.outputs.tested_sha }}

  security_quality:
    name: Security Quality (G2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target commit with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tested commit SHA
        id: sha-check
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          node -e '
            import("./scripts/aggregate-quality.mjs").then(m => {
              m.validateGateShas(process.env.EXPECTED_SHA, process.env.ACTUAL_SHA, "security_quality");
            });
          '
          echo "tested_sha=${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"
        env:
          EXPECTED_SHA: ${{ inputs.target-sha }}
          ACTUAL_SHA: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install authoritative security scanners
        run: node scripts/install-scanners.mjs

      - name: Run G2 security scanner gate
        run: npm run quality:g2
    outputs:
      tested_sha: ${{ steps.sha-check.outputs.tested_sha }}

  browser_quality:
    name: Browser Quality (L3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target-sha }}
          persist-credentials: false

      - name: Validate tested commit SHA
        id: sha-check
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          node -e '
            import("./scripts/aggregate-quality.mjs").then(m => {
              m.validateGateShas(process.env.EXPECTED_SHA, process.env.ACTUAL_SHA, "browser_quality");
            });
          '
          echo "tested_sha=${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"
        env:
          EXPECTED_SHA: ${{ inputs.target-sha }}
          ACTUAL_SHA: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps chromium

      - name: Run L3 browser journey suite
        run: npm run quality:l3

      - name: Upload browser failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/
          retention-days: 14
    outputs:
      tested_sha: ${{ steps.sha-check.outputs.tested_sha }}

  aggregate:
    name: Aggregate Quality Gates
    if: always()
    needs: [code_quality, integration_quality, security_quality, browser_quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target-sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Aggregate and verify all gate outputs
        id: verify-aggregate
        run: |
          node -e '
            import("./scripts/aggregate-quality.mjs").then(m => {
              const res = m.aggregateQualityResults({
                expectedSha: process.env.EXPECTED_SHA,
                results: {
                  code_quality: {
                    result: process.env.CODE_QUALITY_RESULT,
                    testedSha: process.env.CODE_QUALITY_SHA,
                  },
                  integration_quality: {
                    result: process.env.INTEGRATION_QUALITY_RESULT,
                    testedSha: process.env.INTEGRATION_QUALITY_SHA,
                  },
                  security_quality: {
                    result: process.env.SECURITY_QUALITY_RESULT,
                    testedSha: process.env.SECURITY_QUALITY_SHA,
                  },
                  browser_quality: {
                    result: process.env.BROWSER_QUALITY_RESULT,
                    testedSha: process.env.BROWSER_QUALITY_SHA,
                  },
                },
              });
              const fs = require("node:fs");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `tested_sha=${res.testedSha}\n`);
            });
          '
        env:
          EXPECTED_SHA: ${{ inputs.target-sha }}
          CODE_QUALITY_RESULT: ${{ needs.code_quality.result }}
          CODE_QUALITY_SHA: ${{ needs.code_quality.outputs.tested_sha }}
          INTEGRATION_QUALITY_RESULT: ${{ needs.integration_quality.result }}
          INTEGRATION_QUALITY_SHA: ${{ needs.integration_quality.outputs.tested_sha }}
          SECURITY_QUALITY_RESULT: ${{ needs.security_quality.result }}
          SECURITY_QUALITY_SHA: ${{ needs.security_quality.outputs.tested_sha }}
          BROWSER_QUALITY_RESULT: ${{ needs.browser_quality.result }}
          BROWSER_QUALITY_SHA: ${{ needs.browser_quality.outputs.tested_sha }}
    outputs:
      tested-sha: ${{ steps.verify-aggregate.outputs.tested_sha }}
