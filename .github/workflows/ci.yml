name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: '1.4.0'
      node-version: '22.12.0'
      install-policy: 'project'
      coverage-path: 'coverage'
      prepare-command: 'npm run cf:typegen -- --check'
      typecheck-command: 'npm run quality:g1'
      lint: false
      disabled-check-reasons: |-
        {
          "lint": "G1 static checks already run via quality:g1"
        }
      test-command: 'npm run quality:l1'
      l2: true
      l2-command: |
        npm run test:http
        npm run quality:l2
      security-command: 'npm run quality:g2'

  l3:
    name: L3 Browser E2E
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: '1.4.0'
      node-version: '22.12.0'
      install-policy: 'project'
      browser: chromium
      timeout-minutes: 20
      pre-command: 'npm run cf:typegen -- --check'
      command: 'npm run quality:l3'
      artifact-name: browser-failure-artifacts
      artifact-path: test-results/
      artifact-retention-days: 14
