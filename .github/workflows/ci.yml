name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      runtime-version: "1.4.0"
      node-version: "22.12.0"
      install-policy: "project"
      coverage-path: "coverage"
      prepare-command: "npm run cf:typegen -- --check"
      typecheck-command: "npm run quality:g1"
      lint: false
      disabled-check-reasons: |-
        {
          "lint": "G1 static checks already run via quality:g1"
        }
      test-command: "npm run quality:l1"
      l2: true
      l2-command: |
        npm run test:http
        npm run quality:l2
      l3: true
      l3-command: "npm run quality:l3"
      l3-browser: "chromium"
      security-command: "npm run quality:g2"
