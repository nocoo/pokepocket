name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Worker
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      expected-workflow-path: '.github/workflows/ci.yml'
      expected-workflow-name: 'CI'
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || '' }}
      package-version-match: ${{ github.event_name != 'workflow_run' }}
      runtime-version: '1.4.0'
      node-version: '22.23.4'
      install-policy: 'project'
      build-command: |
        bun run build
        bun run verify:access
      require-fresh-main: true
      environment: production
      concurrency-group: deploy-pokepocket-production
      timeout-minutes: 15
      verify-command: 'bun run verify:release'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
