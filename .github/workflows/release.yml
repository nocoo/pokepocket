name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-pokepocket-production
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Release Target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target-sha: ${{ steps.resolve.outputs.target_sha }}
      version: ${{ steps.resolve.outputs.version }}
      event-type: ${{ steps.resolve.outputs.event_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Resolve and validate target commit
        id: resolve
        run: node scripts/resolve-release.mjs
        env:
          EVENT_PATH: ${{ github.event_path }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}

  quality:
    name: Quality Gates
    needs: [resolve]
    uses: ./.github/workflows/quality.yml
    with:
      target-sha: ${{ needs.resolve.outputs.target-sha }}

  deploy:
    name: Deploy Worker
    needs: [resolve, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality.outputs.tested-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch current remote main tip for freshness check
        if: github.event_name == 'workflow_run'
        run: git fetch origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check freshness and verify deploy target
        run: node scripts/verify-deploy.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ needs.quality.outputs.tested-sha }}
          RESOLVED_SHA: ${{ needs.resolve.outputs.target-sha }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}

      - name: Build release assets
        run: bun run build

      - name: Verify Access before deploying
        run: bun run verify:access

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy

      - name: Verify deployed version and Access
        run: bun run verify:release
